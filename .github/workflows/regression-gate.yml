name: Inference Runtime Regression Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false

      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify matching dependency requirements
        run: diff -u baseline/requirements.txt candidate/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r baseline/requirements.txt

      - name: Check model output correctness
        run: |
          python candidate/scripts/check_correctness.py \
            --baseline-root baseline \
            --candidate-root candidate
            
      - name: Create results directory
        run: mkdir -p results

      - name: Run baseline benchmark
        working-directory: baseline
        run: |
          python benchmarks/inference_benchmark.py \
            --device cpu \
            --output ../results/baseline.json \
            --controlled-delay-ms 0

      - name: Run candidate benchmark
        working-directory: candidate
        run: |
          python benchmarks/inference_benchmark.py \
            --device cpu \
            --output ../results/candidate.json \
            --controlled-delay-ms 0

      - name: Compare regression
        working-directory: candidate
        run: |
          python scripts/compare_regression.py \
            --baseline ../results/baseline.json \
            --candidate ../results/candidate.json